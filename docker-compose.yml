# Root Docker Compose for Azure Cloud Portfolio Project
# Enables local orchestration and testing of individual or all portfolios

version: '3.8'

services:
  # Vite / React Portfolios
  sakshi-portfolio:
    build:
      context: ./portfolio-Sakshi
      dockerfile: Dockerfile
    container_name: portfolio-sakshi
    ports:
      - "8021:80"
    restart: unless-stopped

  anshumaan-portfolio:
    build:
      context: ./AnshumaanKhare-portfolio
      dockerfile: Dockerfile
    container_name: portfolio-anshumaan
    ports:
      - "8001:80"
    restart: unless-stopped

  adrish-portfolio:
    build:
      context: ./portfolio-adrish-chowdhury
      dockerfile: Dockerfile
    container_name: portfolio-adrish
    ports:
      - "8005:80"
    restart: unless-stopped

  kalyani-portfolio:
    build:
      context: ./portfolio-kalyani
      dockerfile: Dockerfile
    container_name: portfolio-kalyani
    ports:
      - "8013:80"
    restart: unless-stopped

  kartikaa-portfolio:
    build:
      context: ./portfolio-kartikaa
      dockerfile: Dockerfile
    container_name: portfolio-kartikaa
    ports:
      - "8014:80"
    restart: unless-stopped

  megha-portfolio:
    build:
      context: ./portfolio-megha
      dockerfile: Dockerfile
    container_name: portfolio-megha
    ports:
      - "8016:80"
    restart: unless-stopped

  # Python / Flask Portfolio
  smrithi-portfolio:
    build:
      context: ./portfolio-smrithi
      dockerfile: Dockerfile
    container_name: portfolio-smrithi
    ports:
      - "8024:5000"
    restart: unless-stopped

  # Express / Node Servers
  rohit-portfolio:
    build:
      context: ./portfolio-rohit
      dockerfile: Dockerfile
    container_name: portfolio-rohit
    ports:
      - "8019:8080"
    restart: unless-stopped

  simran-portfolio:
    build:
      context: ./portfolio-simran
      dockerfile: Dockerfile
    container_name: portfolio-simran
    ports:
      - "8023:3000"
    restart: unless-stopped

  # Next.js Portfolios
  govind-madhav-portfolio:
    build:
      context: ./portfolio-govind-madhav
      dockerfile: Dockerfile
    container_name: portfolio-govind-madhav
    ports:
      - "8010:3000"
    restart: unless-stopped

  utkarsh-portfolio:
    build:
      context: ./portfolio-utkarsh
      dockerfile: Dockerfile
    container_name: portfolio-utkarsh
    ports:
      - "8027:80"
    restart: unless-stopped

  # Static HTML Portfolios
  abel-shon-portfolio:
    build:
      context: ./portfolio-abel-shon
      dockerfile: Dockerfile
    container_name: portfolio-abel-shon
    ports:
      - "8002:80"
    restart: unless-stopped

  devyansh-portfolio:
    build:
      context: ./portfolio-devyansh
      dockerfile: Dockerfile
    container_name: portfolio-devyansh
    ports:
      - "8007:80"
    restart: unless-stopped

  prem-portfolio:
    build:
      context: ./portfolio-prem
      dockerfile: Dockerfile
    container_name: portfolio-prem
    ports:
      - "8018:80"
    restart: unless-stopped
