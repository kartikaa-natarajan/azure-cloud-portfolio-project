# Docker embedded DNS resolver - allows Nginx to start even if some containers are offline
resolver 127.0.0.11 valid=10s ipv6=off;

# Landing Page (Root domain, localhost, or bare IP)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}

# Subdomain virtual host router: <name>.<domain>
server {
    listen 80;
    server_name ~^(?<site>[a-z][a-z0-9-]*)\.;

    client_max_body_size 10m;

    location / {
        if ($upstream = "") {
            return 404 "Portfolio not found\n";
        }

        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    error_page 502 503 504 /_down;
    location = /_down {
        internal;
        default_type text/plain;
        return 503 "This portfolio container is starting or offline. Please check back shortly.\n";
    }
}
