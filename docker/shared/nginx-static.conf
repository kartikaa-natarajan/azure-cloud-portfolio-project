server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Student backends (Azure Functions, Express APIs, databases) are not part of the
    # containerized deployment. Return a clean JSON error so contact forms fail gracefully.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"This API is not available in the containerized deployment."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
