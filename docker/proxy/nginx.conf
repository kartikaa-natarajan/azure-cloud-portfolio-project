map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Host-based routing: <name>.<anything> -> container p-<name>.
# Names not listed in the map below are never proxied (404).
map $site $upstream {
    default              "";
    abel-shon            p-abel-shon:80;
    abhishek-kumar       p-abhishek-kumar:80;
    adithya-tej-bm       p-adithya-tej-bm:80;
    adrish-chowdhury     p-adrish-chowdhury:80;
    anshumaankhare       p-anshumaankhare:80;
    anusha               p-anusha:80;
    devyansh             p-devyansh:80;
    dhruvi-bagga         p-dhruvi-bagga:80;
    gayathri             p-gayathri:3000;
    govind-madhav        p-govind-madhav:3000;
    hemanth-raj          p-hemanth-raj:80;
    jeeva                p-jeeva:80;
    kalyani              p-kalyani:80;
    kartikaa             p-kartikaa:80;
    manish-yadav         p-manish-yadav:80;
    megha                p-megha:80;
    prajwal              p-prajwal:80;
    prem                 p-prem:80;
    rohit                p-rohit:80;
    rubika               p-rubika:80;
    shivam               p-shivam:80;
    simran               p-simran:80;
    smrithi              p-smrithi:8000;
    utkarsh              p-utkarsh:80;
    vinod                p-vinod:3000;
}

# Docker's embedded DNS; lets nginx start even if a portfolio container is down.
resolver 127.0.0.11 valid=10s ipv6=off;

# Landing page (any host that is not <name>.<domain>, e.g. localhost or a bare IP)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location = /healthz { return 200 "ok\n"; }
}

# One virtual host for every portfolio subdomain
server {
    listen 80;
    server_name ~^(?<site>[a-z][a-z0-9-]*)\.;

    client_max_body_size 5m;

    location / {
        if ($upstream = "") { return 404 "Unknown portfolio\n"; }
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    error_page 502 503 504 /_down;
    location = /_down {
        internal;
        default_type text/plain;
        return 503 "This portfolio container is starting or down. Try again in a moment.\n";
    }
}
